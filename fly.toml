app = "data-panel-zhang"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"   # 明确使用 Dockerfile 构建

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
