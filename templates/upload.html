{% extends "base.html" %}
{% block content %}
<h2>📝 上传新记录</h2>
<form method="post">
    <div class="row">
        <div class="col-md-3 mb-3"><input class="form-control" name="loan_date" placeholder="下款日期 *" required></div>
        <div class="col-md-3 mb-3"><input class="form-control" name="end_date" placeholder="结束日期"></div>
        <div class="col-md-3 mb-3"><input class="form-control" name="name" placeholder="姓名 *" required></div>
        <div class="col-md-3 mb-3"><input class="form-control" name="amount" placeholder="额度 *" required></div>
        <div class="col-md-3 mb-3"><input class="form-control" name="principal" placeholder="本金 *" required></div>
        <div class="col-md-3 mb-3"><input class="form-control" name="weekly" placeholder="周续"></div>
        <div class="col-md-3 mb-3"><input class="form-control" name="daily" placeholder="天续"></div>
        <div class="col-md-3 mb-3"><input class="form-control" name="profit" placeholder="利润"></div>
        <div class="col-md-3 mb-3"><input class="form-control" name="overdue" placeholder="逾期"></div>
        <div class="col-md-3 mb-3"><input class="form-control" name="receive_time" placeholder="收款时间"></div>
        <div class="col-md-3 mb-3"><input class="form-control" name="remark" placeholder="备注"></div>
        <div class="col-md-3 mb-3"><input class="form-control" name="phone_model" placeholder="手机型号"></div>
        <div class="col-md-3 mb-3"><input class="form-control" name="id_card" placeholder="身份证号码"></div>
        <div class="col-md-3 mb-3"><input class="form-control" name="imei" placeholder="IMEI"></div>
        <div class="col-md-3 mb-3"><input class="form-control" name="agent" placeholder="中介"></div>
        <div class="col-md-3 mb-3"><input class="form-control" name="commission" placeholder="佣金"></div>
        <div class="col-md-3 mb-3"><input class="form-control" name="supervision_period" placeholder="监管期"></div>
        <div class="col-md-3 mb-3">
            <select class="form-select" name="is_android">
                <option value="">是否安卓</option>
                <option value="是">是</option>
                <option value="否">否</option>
            </select>
        </div>
    </div>
    <button class="btn btn-primary" type="submit">提交</button>
</form>
{% endblock %}
