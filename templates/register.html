{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <h2 class="text-center">注册</h2>
        <form method="post">
            <div class="mb-3"><input class="form-control" name="username" placeholder="用户名" required></div>
            <div class="mb-3"><input class="form-control" name="password" type="password" placeholder="密码" required></div>
            <button class="btn btn-success w-100" type="submit">注册</button>
            <p class="text-center mt-3"><a href="{{ url_for('login') }}">已有账号？登录</a></p>
        </form>
    </div>
</div>
{% endblock %}
