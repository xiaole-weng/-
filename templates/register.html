{% extends "base.html" %}
{% block content %}
<h2>注册</h2>
<form method="post">
    <div class="mb-3"><input class="form-control" name="username" placeholder="用户名"></div>
    <div class="mb-3"><input class="form-control" name="password" type="password" placeholder="密码"></div>
    <button class="btn btn-primary" type="submit">注册</button>
    <a href="{{ url_for('auth.login') }}" class="btn btn-link">已有账号？登录</a>
</form>
{% endblock %}
